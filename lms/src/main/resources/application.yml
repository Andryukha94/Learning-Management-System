server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lms_db
    username: privateclub
    password: 12345

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

scheduler:
  schedule-cleanup:
    cron: 0 0 3 * * *