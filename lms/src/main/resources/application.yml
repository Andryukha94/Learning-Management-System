server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lms_db
    username: privateclub
    password: 12345

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        open-in-view: false

        management:
          endpoints:
            web:
              exposure:
                include: health,info
